name: DeepSeek代码检测\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main, develop ]\n\njobs:\n  lint-and-test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      \n      - name: 设置Node.js\n        uses: actions/setup-node@v3\n        with:\n          node-version: '18'\n          cache: 'npm'\n          \n      - name: 安装依赖\n        run: npm ci\n        \n      - name: 运行ESLint\n        run: npm run lint\n        \n      - name: 运行测试\n        run: npm test\n  \n  deepseek-analysis:\n    runs-on: ubuntu-latest\n    needs: lint-and-test\n    steps:\n      - uses: actions/checkout@v3\n        with:\n          fetch-depth: 0\n      \n      - name: 设置Python\n        uses: actions/setup-python@v4\n        with:\n          python-version: '3.10'\n          \n      - name: 安装依赖\n        run: |\n          python -m pip install --upgrade pip\n          pip install requests\n\n      - name: 获取代码变更\n        id: changed-files\n        uses: tj-actions/changed-files@v35\n      \n      - name: DeepSeek代码分析\n        env:\n          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}\n          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          # 如果是PR，获取PR的差异内容\n          if [[ ! -z \"${{ github.event.pull_request.number }}\" ]]; then\n            DIFF_URL=\"https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}\"\n            DIFF_CONTENT=$(curl -s -H \"Authorization: token $GITHUB_TOKEN\" -H \"Accept: application/vnd.github.v3.diff\" $DIFF_URL)\n          else\n            # 如果是推送，获取最新提交与之前提交的差异\n            git diff HEAD~1 HEAD > code_diff.txt\n            DIFF_CONTENT=$(cat code_diff.txt)\n          fi\n          \n          # 创建分析脚本\n          cat > deepseek_analysis.py << 'EOF'\n          import os\n          import requests\n          import json\n          import sys\n          \n          # 环境变量\n          api_key = os.environ.get(\"DEEPSEEK_API_KEY\")\n          pr_number = os.environ.get(\"PR_NUMBER\")\n          github_token = os.environ.get(\"GITHUB_TOKEN\")\n          repo = os.environ.get(\"GITHUB_REPOSITORY\")\n          \n          # 获取差异内容\n          diff_content = sys.stdin.read()\n          \n          # 检查是否有代码变更\n          if not diff_content.strip():\n              print(\"没有检测到代码变更，跳过分析\")\n              sys.exit(0)\n          \n          # 调用DeepSeek API进行代码分析\n          def analyze_with_deepseek(code_diff):\n              url = \"https://api.deepseek.com/v1/code_review\"\n              \n              headers = {\n                  \"Content-Type\": \"application/json\",\n                  \"Authorization\": f\"Bearer {api_key}\"\n              }\n              \n              data = {\n                  \"model\": \"deepseek-coder\",\n                  \"messages\": [\n                      {\n                          \"role\": \"system\", \n                          \"content\": \"你是一位专业的代码审查专家，请帮我分析以下代码差异，重点关注：\\n\"\n                                    \"1. 代码质量问题\\n\"\n                                    \"2. 潜在的性能隐患\\n\"\n                                    \"3. 安全漏洞\\n\"\n                                    \"4. TypeScript类型问题\\n\"\n                                    \"5. React最佳实践\\n\"\n                                    \"6. 改进建议\\n\\n\"\n                                    \"请提供具体、有建设性的反馈，格式为Markdown。\"\n                      },\n                      {\n                          \"role\": \"user\",\n                          \"content\": f\"请分析以下代码差异：\\n\\n```diff\\n{code_diff}\\n```\"\n                      }\n                  ],\n                  \"temperature\": 0.2,\n                  \"max_tokens\": 2000\n              }\n              \n              try:\n                  response = requests.post(url, headers=headers, json=data)\n                  response.raise_for_status()\n                  result = response.json()\n                  return result.get(\"choices\", [{}])[0].get(\"message\", {}).get(\"content\", \"分析失败\")\n              except Exception as e:\n                  return f\"调用DeepSeek API时出错: {str(e)}\"\n          \n          # 获取分析结果\n          analysis_result = analyze_with_deepseek(diff_content)\n          \n          # 将分析结果保存到文件\n          with open(\"deepseek_analysis_result.md\", \"w\") as f:\n              f.write(analysis_result)\n          \n          print(\"代码分析完成，结果已保存到deepseek_analysis_result.md\")\n          \n          # 如果是PR，将分析结果作为评论添加到PR\n          if github_token and pr_number and repo:\n              try:\n                  comment_url = f\"https://api.github.com/repos/{repo}/issues/{pr_number}/comments\"\n                  headers = {\n                      \"Authorization\": f\"token {github_token}\",\n                      \"Accept\": \"application/vnd.github.v3+json\"\n                  }\n                  comment_data = {\n                      \"body\": f\"## DeepSeek AI代码分析\\n\\n{analysis_result}\\n\\n*此评论由DeepSeek AI自动生成*\"\n                  }\n                  comment_response = requests.post(comment_url, headers=headers, json=comment_data)\n                  comment_response.raise_for_status()\n                  print(f\"已将分析结果作为评论添加到PR #{pr_number}\")\n              except Exception as e:\n                  print(f\"添加PR评论时出错: {str(e)}\")\n          EOF\n          \n          # 运行分析脚本\n          cat << EOF | python deepseek_analysis.py\n          $DIFF_CONTENT\n          EOF\n          \n      - name: 上传分析结果\n        uses: actions/upload-artifact@v3\n        with:\n          name: deepseek-analysis\n          path: deepseek_analysis_result.md